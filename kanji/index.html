<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}.home{font-size:13px;color:var(--ai);text-decoration:none;margin-right:4px}</style>
<title>교육한자 1026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F2F3EF; --sheet:#FBFBF8; --ink:#1C2024; --ink2:#565C63; --line:#D9DCD5; --grid:#E6C9C2;
  --ai:#2E4E7E; --ai-soft:#E3E9F2; --shu:#B8432F; --ok:#3F7A4E; --ok-soft:#E2EEE4;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Hiragino Sans","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--paper:#14171A;--sheet:#1C2024;--ink:#E7E8E3;--ink2:#9AA0A6;--line:#30353B;--grid:#5A3A34;
  --ai:#8EAAD8;--ai-soft:#223149;--shu:#E0735E;--ok:#7DBB8C;--ok-soft:#1F3326;}}
:root[data-theme="dark"]{
  color-scheme:dark;--paper:#14171A;--sheet:#1C2024;--ink:#E7E8E3;--ink2:#9AA0A6;--line:#30353B;--grid:#5A3A34;
  --ai:#8EAAD8;--ai-soft:#223149;--shu:#E0735E;--ok:#7DBB8C;--ok-soft:#1F3326;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-inline:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--mincho);font-weight:700;font-size:24px;margin:0;letter-spacing:.02em}
h1 small{font-family:var(--sans);font-size:13px;color:var(--ink2);font-weight:400;margin-left:8px;letter-spacing:0}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:6px;color:var(--ink2);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-soft);color:var(--ai);font-weight:600}
#q{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 10px;font:inherit;color:var(--ink)}
.stat{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
main{padding-block:16px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile:hover{border-color:var(--ai)}
.tile .no{position:absolute;top:4px;left:6px;font-size:10px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tile .kj{font-family:var(--mincho);font-size:40px;line-height:1.15;font-weight:500}
.tile .hn{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.known{background:var(--ok-soft);border-color:transparent}
.tile.known::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
body.mask .tile .hn{color:transparent;background:var(--line);border-radius:3px;min-width:48px}
.gh{grid-column:1/-1;font-family:var(--mincho);font-size:17px;font-weight:700;margin:14px 0 2px;display:flex;align-items:baseline;gap:8px}
.gh:first-child{margin-top:0}
.gh span{font-family:var(--sans);font-size:12px;color:var(--ink2);font-weight:400}
.empty{color:var(--ink2);padding:40px 0;text-align:center}
/* 상세 */
dialog{border:0;padding:0;background:transparent;max-width:min(560px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(10,12,14,.45)}
.sheet{background:var(--sheet);color:var(--ink);border-radius:12px;padding:20px;display:grid;gap:16px}
.dhead{display:flex;gap:18px;align-items:center}
.masu{flex:none;width:132px;height:132px;max-width:100%;border:2px solid var(--shu);position:relative;display:grid;place-items:center;background:var(--sheet)}
.masu::before,.masu::after{content:"";position:absolute;border:0 dashed var(--grid)}
.masu::before{left:50%;top:0;bottom:0;border-left-width:1px}
.masu::after{top:50%;left:0;right:0;border-top-width:1px}
.masu b{position:relative;z-index:1;font-family:var(--mincho);font-weight:500;font-size:96px;line-height:1}
.meta{display:grid;gap:4px;min-width:0}
.meta .hun{font-size:22px;font-weight:600}
.meta .sub{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rd{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.rd dt{font-size:12px;color:var(--ink2);letter-spacing:.04em}
.rd dd{margin:0;font-size:17px}
.rd .ok{color:var(--ink2);font-size:13px}
.ex{border-top:1px solid var(--line);display:grid}
.ex div{display:grid;grid-template-columns:minmax(72px,auto) 1fr;gap:2px 14px;padding:9px 0;border-bottom:1px solid var(--line)}
.ex .w{font-family:var(--mincho);font-size:20px;grid-row:span 2;align-self:center}
.ex .y{font-size:13px;color:var(--ai)}
.ex .m{font-size:14px}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 14px;font-weight:500}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.good{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.btn.bad{border-color:var(--shu);color:var(--shu)}
.grow{flex:1}
/* 카드 */
.stage{max-width:520px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;min-height:360px;padding:22px;display:grid;place-items:center;text-align:center;cursor:pointer;user-select:none}
.card .big{font-family:var(--mincho);font-size:128px;line-height:1;font-weight:500}
.card .hint{font-size:13px;color:var(--ink2);margin-top:12px}
.card .back{display:grid;gap:10px;width:100%;text-align:left}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ai)}
.row{display:flex;gap:8px}
.row .btn{flex:1;padding:12px}
/* 퀴즈 */
.qk{font-family:var(--mincho);font-size:44px;text-align:center;line-height:1.2}
.qp{text-align:center;color:var(--ink2);font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:14px 8px;font-size:17px}
.opts button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opts button.wrong{border-color:var(--shu);color:var(--shu)}
.sel{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 8px;font:inherit;color:var(--ink)}
.score{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
@media (max-width:480px){
  .tabs{margin-left:0;width:100%}.tabs button{flex:1}
  .masu{width:104px;height:104px}.masu b{font-size:76px}
  .card .big{font-size:104px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<div class="wrap">
<header>
  <div class="top">

</div>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
D.forEach((d,i)=>d.n=i+1);
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem('k1026')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('k1026',JSON.stringify([...known]))}catch(e){}};
const st={g:0,q:'',view:'list',mask:false,hideKnown:false};
try{Object.assign(st,JSON.parse(localStorage.getItem('k1026ui')||'{}'))}catch(e){}
const saveUi=()=>{try{localStorage.setItem('k1026ui',JSON.stringify({g:st.g,view:st.view,mask:st.mask,hideKnown:st.hideKnown}))}catch(e){}};
const kun=s=>s.replace(/\.(.+)$/,'($1)');
const num=n=>String(n).padStart(4,'0');

// 학년 칩
const G=[0,1,2,3,4,5,6];
$('#grades').innerHTML=G.map(g=>`<button class="chip" data-g="${g}">${g?g+'학년':'전체'}</button>`).join('');
$('#grades').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;st.g=+b.dataset.g;saveUi();refresh(true)};
$('#q').oninput=e=>{st.q=e.target.value.trim();refresh(true)};
$('#mask').onclick=()=>{st.mask=!st.mask;saveUi();refresh()};
$('#hideKnown').onclick=()=>{st.hideKnown=!st.hideKnown;saveUi();refresh(true)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{st.view=b.dataset.view;saveUi();refresh(true)});

function pool(){
  const q=st.q.toLowerCase();
  return D.filter(d=>(!st.g||d.g===st.g)&&(!st.hideKnown||!known.has(d.k))&&(!q||
    d.k.includes(q)||d.h.includes(q)||d.on.some(r=>r.includes(q))||d.kun.some(r=>r.replace('.','').includes(q))||
    d.ex.some(x=>x[0].includes(q)||x[1].includes(q)||x[2].includes(q))));
}

function refresh(reset){
  document.querySelectorAll('#grades .chip').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.g===st.g));
  $('#mask').setAttribute('aria-pressed',st.mask);$('#hideKnown').setAttribute('aria-pressed',st.hideKnown);
  document.body.classList.toggle('mask',st.mask);
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===st.view));
  ['list','card','quiz'].forEach(v=>$('#v-'+v).hidden=v!==st.view);
  const P=pool();
  const scope=st.g?D.filter(d=>d.g===st.g):D;
  const kc=scope.filter(d=>known.has(d.k)).length;
  $('#stat').textContent=`${P.length}자 표시 · 외운 한자 ${kc}/${scope.length}`;
  if(st.view==='list')renderList(P);
  else if(st.view==='card'){if(reset||!deck)newDeck(P);renderCard()}
  else{if(reset||!qz)newQuiz(P);renderQuiz()}
}

function renderList(P){
  if(!P.length){$('#grid').innerHTML='<p class="empty">조건에 맞는 한자가 없습니다.</p>';return}
  let h='',cur=0;
  for(const d of P){
    if(d.g!==cur&&!st.q){cur=d.g;const c=P.filter(x=>x.g===cur).length;h+=`<div class="gh">${cur}학년<span>${c}자</span></div>`}
    h+=`<button class="tile${known.has(d.k)?' known':''}" data-n="${d.n}"><span class="no">${num(d.n)}</span><span class="kj">${d.k}</span><span class="hn">${esc(d.h)}</span></button>`;
  }
  $('#grid').innerHTML=h;
}
$('#grid').onclick=e=>{const t=e.target.closest('.tile');if(t)openDetail(D[t.dataset.n-1])};

  return `<div class="rd">
      <dt>음독</dt><dd>${d.on.length?d.on.join('、'):'<span class="ok">없음</span>'}</dd>
      <dt>훈독</dt><dd>${d.kun.length?d.kun.map(kun).join('、'):'<span class="ok">없음</span>'}</dd>
    </div>
    <div class="ex">${d.ex.map(x=>`<div><span class="w">${x[0]}</span><span class="y">${x[1]}</span><span class="m">${esc(x[2])}</span></div>`).join('')}</div>`;
}
function openDetail(d){
  const s=$('#dsheet');
  const draw=()=>{s.innerHTML=`<div class="dhead"><div class="masu"><b>${d.k}</b></div>
    <div class="meta"><span class="sub">${num(d.n)} · ${d.g}학년 · ${d.s}획</span><span class="hun">${esc(d.h)}</span></div></div>
    ${detailBody(d)}
    <div class="dact">
      <button class="btn ${known.has(d.k)?'good':''}" id="dk">${known.has(d.k)?'외웠음 ✓':'외웠음으로 표시'}</button>
      <span class="grow"></span>
      <button class="btn" id="dp" ${d.n===1?'disabled':''}>이전</button>
      <button class="btn" id="dn" ${d.n===D.length?'disabled':''}>다음</button>
      <button class="btn pri" id="dc">닫기</button>
    </div>`;
    $('#dk').onclick=()=>{known.has(d.k)?known.delete(d.k):known.add(d.k);save();draw();refresh()};
    $('#dp').onclick=()=>{d=D[d.n-2];draw()};$('#dn').onclick=()=>{d=D[d.n];draw()};
    $('#dc').onclick=()=>$('#dlg').close();
  };
  draw();$('#dlg').showModal();
}
$('#dlg').onclick=e=>{if(e.target.id==='dlg')e.target.close()};

// 암기 카드
let deck=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function newDeck(P){deck={list:shuffle(P),i:0,flip:false,ok:0,no:0}}
function renderCard(){
  const S=$('#stage');
  if(!deck.list.length){S.innerHTML='<p class="empty">카드로 볼 한자가 없습니다. 학년이나 필터를 바꿔 보세요.</p>';return}
  if(deck.i>=deck.list.length){
    S.innerHTML=`<div class="card"><div><div class="qk">한 바퀴 끝</div><p class="qp">알아요 ${deck.ok} · 모르겠어요 ${deck.no}</p></div></div>
    <div class="row"><button class="btn pri" id="again">다시 섞어서 시작</button></div>`;
    $('#again').onclick=()=>{newDeck(pool());renderCard()};return;
  }
  const d=deck.list[deck.i];
  S.innerHTML=`<div class="prog"><span>${deck.i+1} / ${deck.list.length}</span><span>${d.g}학년 · ${num(d.n)}</span></div>
  <div class="pbar"><i style="width:${deck.i/deck.list.length*100}%"></i></div>
  <div class="card" id="fc" tabindex="0">${deck.flip?`<div class="back">
      <div class="dhead"><div class="masu"><b>${d.k}</b></div><div class="meta"><span class="sub">${d.s}획</span><span class="hun">${esc(d.h)}</span></div></div>
      ${detailBody(d)}</div>`
    :`<div><div class="big">${d.k}</div><div class="hint">눌러서 훈음·읽기 확인 (Space)</div></div>`}</div>
  <div class="row"><button class="btn bad" id="no">모르겠어요</button><button class="btn good" id="yes">알아요</button></div>`;
  $('#fc').onclick=()=>{deck.flip=!deck.flip;renderCard()};
  $('#yes').onclick=()=>mark(true);$('#no').onclick=()=>mark(false);
}
function mark(ok){const d=deck.list[deck.i];ok?(known.add(d.k),deck.ok++):(known.delete(d.k),deck.no++);save();deck.i++;deck.flip=false;refresh()}
document.addEventListener('keydown',e=>{
  if($('#dlg').open||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(st.view==='card'&&deck&&deck.i<deck.list.length){
    if(e.key===' '){e.preventDefault();deck.flip=!deck.flip;renderCard()}
    else if(e.key==='ArrowRight')mark(true);else if(e.key==='ArrowLeft')mark(false);
  }
  if(st.view==='quiz'&&qz&&/^[1-4]$/.test(e.key))pick(+e.key-1);
});

// 퀴즈
let qz=null;
const MODES={hun:'한자의 훈음 고르기',on:'한자의 음독 고르기',word:'단어 읽기 고르기',rev:'훈음 보고 한자 고르기'};
function newQuiz(P){qz={P,mode:qz?qz.mode:'hun',n:0,ok:0,cur:null};nextQ()}
function nextQ(){
  const P=qz.P;if(P.length<1){qz.cur=null;return}
  let d,opts,ans,prompt,big;
  const others=f=>shuffle(D.filter(x=>x!==d)).map(f);
  const uniq=(a,right)=>{const s=[right];for(const v of a){if(v&&!s.includes(v))s.push(v);if(s.length===4)break}return shuffle(s)};
  if(qz.mode==='on'){const Q=P.filter(x=>x.on.length);d=Q[Math.random()*Q.length|0]||P[0];ans=d.on[0]||'없음';opts=uniq(others(x=>x.on[0]).filter(v=>!d.on.includes(v)),ans);big=d.k;prompt='음독은?'}
  else if(qz.mode==='word'){d=P[Math.random()*P.length|0];const w=d.ex[Math.random()*d.ex.length|0];ans=w[1];opts=uniq(shuffle(D.flatMap(x=>x.ex.filter(y=>y[0].length===w[0].length).map(y=>y[1]))).filter(v=>v!==ans),ans);big=w[0];prompt=`읽는 법은? (${esc(w[2])})`}
  else if(qz.mode==='rev'){d=P[Math.random()*P.length|0];ans=d.k;opts=uniq(others(x=>x.k),ans);big=esc(d.h);prompt='이 훈음의 한자는?'}
  else{d=P[Math.random()*P.length|0];ans=d.h;opts=uniq(others(x=>x.h),ans);big=d.k;prompt='훈음은?'}
  qz.cur={d,opts,ans,prompt,big,picked:-1};
}
function renderQuiz(){
  const Z=$('#quiz');
  const head=`<div class="bar" style="justify-content:space-between;margin:0"><select class="sel" id="qm">${Object.entries(MODES).map(([k,v])=>`<option value="${k}" ${k===qz.mode?'selected':''}>${v}</option>`).join('')}</select>
    <span class="score">${qz.n}문제 중 ${qz.ok}개 정답${qz.n?` (${Math.round(qz.ok/qz.n*100)}%)`:''}</span></div>`;
  if(!qz.cur){Z.innerHTML=head+'<p class="empty">문제로 낼 한자가 없습니다.</p>';bindQm();return}
  const c=qz.cur,done=c.picked>=0;
  Z.innerHTML=head+`<div class="card" style="cursor:default;min-height:220px"><div><div class="qk" style="${qz.mode==='rev'?'font-family:var(--sans);font-size:32px':'font-size:72px'}">${c.big}</div><p class="qp">${c.prompt}</p></div></div>
    <div class="opts">${c.opts.map((o,i)=>`<button data-i="${i}" class="${done&&o===c.ans?'right':done&&i===c.picked?'wrong':''}" ${qz.mode==='rev'?'style="font-family:var(--mincho);font-size:30px"':''}>${esc(qz.mode==='on'||qz.mode==='word'?o:o)}</button>`).join('')}</div>
    ${done?`<div class="sheet" style="border:1px solid var(--line)"><div class="dhead"><div class="masu"><b>${c.d.k}</b></div><div class="meta"><span class="sub">${num(c.d.n)} · ${c.d.g}학년</span><span class="hun">${esc(c.d.h)}</span></div></div>${detailBody(c.d)}</div>
    <div class="row"><button class="btn pri" id="qn">다음 문제 (Enter)</button></div>`:''}`;
  Z.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  if(done){$('#qn').onclick=()=>{nextQ();renderQuiz()};$('#qn').focus()}
  bindQm();
}
function bindQm(){$('#qm').onchange=e=>{qz.mode=e.target.value;qz.n=qz.ok=0;nextQ();renderQuiz()}}
function pick(i){const c=qz.cur;if(!c||c.picked>=0||i>=c.opts.length)return;c.picked=i;qz.n++;if(c.opts[i]===c.ans)qz.ok++;renderQuiz()}

$('#q').value=st.q;
refresh(true);
</script>

</body>
